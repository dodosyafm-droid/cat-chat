<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Live2D: проверка (PixiJS 8 + Cubism 5)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px system-ui, "Segoe UI", sans-serif; color: #eee; }
    body.bg-check {
        background-color: #bbb;
        background-image:
            linear-gradient(45deg, #888 25%, transparent 25%, transparent 75%, #888 75%),
            linear-gradient(45deg, #888 25%, transparent 25%, transparent 75%, #888 75%);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
    }
    body.bg-dark { background: #15151b; }
    #stage { position: absolute; inset: 0 340px 0 0; }
    #stage canvas { display: block; }
    #panel {
        position: absolute; top: 0; right: 0; bottom: 0; width: 340px; box-sizing: border-box;
        padding: 10px; overflow: auto; background: rgba(18, 18, 26, 0.95); z-index: 5;
    }
    #panel h3 { margin: 12px 0 6px; font-size: 13px; color: #f3c46b; }
    #panel button { margin: 2px 2px 2px 0; padding: 4px 8px; cursor: pointer; background: #3a3a4d; color: #eee; border: 1px solid #555; border-radius: 4px; }
    #panel label { display: block; margin: 4px 0; }
    #log { white-space: pre-wrap; line-height: 1.4; word-break: break-word; }
    #log .err { color: #ff8a8a; }
    #log .ok { color: #8aff9d; }
</style>
</head>
<body class="bg-check">

<div id="stage"></div>

<div id="panel">
    <h3>Состояние</h3>
    <div id="log"></div>

    <h3>Фон</h3>
    <button data-bg="bg-check">Шахматка</button>
    <button data-bg="bg-dark">Тёмный</button>

    <h3>Размер модели (если кота не видно)</h3>
    <select id="mode">
        <option value="css">квадрат по центру</option>
        <option value="dpr">квадрат × плотность экрана</option>
        <option value="full">на весь экран (как в примере библиотеки)</option>
    </select>
    <button id="refit">Применить</button>
    <button id="report">Показать размеры</button>
    <div>Розовая рамка показывает, где модель должна быть.</div>

    <h3>Проверка управления параметрами</h3>
    <div>Включай по одной галочке и смотри, двигается ли кот.</div>
    <label><input type="checkbox" id="t-eyes"> закрыть глаза</label>
    <label><input type="checkbox" id="t-tail"> качать хвост (ParamAngleX)</label>
    <label><input type="checkbox" id="t-ears"> шевелить ушки (ParamBrowLForm)</label>
    <label><input type="checkbox" id="t-paw"> махать лапой (ParamAngleY)</label>
</div>

<!-- Cubism Core 5: файл из Cubism SDK for Web (папка Core), лежит рядом с этой страницей -->
<script src="./live2dcubismcore.min.js"></script>

<script type="module">
const logBox = document.getElementById('log');

function log(message, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = message;
    logBox.appendChild(line);
}

window.addEventListener('error', e => log('Ошибка: ' + e.message, 'err'));
window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    log('Ошибка: ' + (r && r.message ? r.message : r), 'err');
});

document.querySelectorAll('[data-bg]').forEach(b => {
    b.addEventListener('click', () => { document.body.className = b.dataset.bg; });
});

const MODEL_URL = new URLSearchParams(location.search).get('model') || './model/cat.model3.json';

async function main() {

    if (!window.Live2DCubismCore) {
        log('Не найден live2dcubismcore.min.js рядом со страницей.', 'err');
        return;
    }
    log('Cubism Core найден.', 'ok');

    let pixi, e2d;
    try {
        pixi = await import('https://esm.sh/pixi.js@8');
        e2d = await import('https://esm.sh/easy-live2d?deps=pixi.js@8');
    } catch (e) {
        log('Не удалось загрузить библиотеки: ' + e.message, 'err');
        return;
    }
    log('PixiJS и easy-live2d загружены.', 'ok');

    const { Application, Ticker, Graphics } = pixi;
    const { Live2DSprite, Config } = e2d;

    if (Config) Config.MouseFollow = false;

    const app = new Application();
    await app.init({ resizeTo: document.getElementById('stage'), backgroundAlpha: 0, antialias: true });
    document.getElementById('stage').appendChild(app.canvas);

    log('Загружаю модель: ' + MODEL_URL);

    const sprite = new Live2DSprite();
    await sprite.init({ modelPath: MODEL_URL, ticker: Ticker.shared });
    app.stage.addChild(sprite);
    log('Модель загружена.', 'ok');

    /* ждём полной готовности модели, если библиотека это поддерживает */
    try {
        if (sprite.ready && typeof sprite.ready.then === 'function') {
            await sprite.ready;
            log('sprite.ready: готово.', 'ok');
        } else {
            log('sprite.ready: ' + String(sprite.ready));
        }
    } catch (e) {
        log('sprite.ready: ошибка ' + e.message, 'err');
    }

    const frame = new Graphics();
    app.stage.addChild(frame);

    const dpr = window.devicePixelRatio || 1;
    const stageBox = document.getElementById('stage');

    const call = name => {
        try { return JSON.stringify(sprite[name]()); }
        catch (e) { return 'ошибка: ' + e.message; }
    };

    const report = () => {
        log('--- размеры ---');
        log('экран Pixi: ' + app.screen.width + 'x' + app.screen.height +
            ', холст: ' + app.canvas.width + 'x' + app.canvas.height + ', dpr ' + dpr);
        log('спрайт: x=' + sprite.x + ' y=' + sprite.y + ' w=' + sprite.width + ' h=' + sprite.height +
            ' visible=' + sprite.visible + ' alpha=' + sprite.alpha);
        ['getSize', 'getModelCanvasSize', 'getLocalModelWidth', 'getLocalModelHeight', 'getRenderViewport', 'getCanvasViewport']
            .forEach(n => { if (typeof sprite[n] === 'function') log(n + ': ' + call(n)); });
    };

    const fit = () => {
        const mode = document.getElementById('mode').value;
        const w = app.screen.width, h = app.screen.height;
        const s = Math.min(w, h);
        let sw = s, sh = s;

        if (mode === 'dpr') { sw = s * dpr; sh = s * dpr; }
        if (mode === 'full') { sw = stageBox.clientWidth * dpr; sh = stageBox.clientHeight * dpr; }

        try {
            if (typeof sprite.setSize === 'function') sprite.setSize(sw, sh);
            else { sprite.width = sw; sprite.height = sh; }
        } catch (e) {
            log('setSize: ' + e.message, 'err');
        }

        sprite.x = mode === 'full' ? 0 : (w - sw) / 2;
        sprite.y = mode === 'full' ? 0 : (h - sh) / 2;

        frame.clear();
        frame.rect(sprite.x, sprite.y, sw, sh).stroke({ width: 3, color: 0xff00ff });
    };

    fit();
    report();

    window.addEventListener('resize', fit);
    document.getElementById('refit').addEventListener('click', () => { fit(); report(); });
    document.getElementById('report').addEventListener('click', report);

    /* какие методы есть у спрайта: пришли этот список мне, если что-то не работает */
    const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(sprite)).filter(n => n !== 'constructor');
    log('Методы спрайта: ' + methods.join(', '));

    if (typeof sprite.setParameterValueById !== 'function') {
        log('Метода setParameterValueById нет: управление параметрами придётся делать иначе.', 'err');
        return;
    }

    /* проверка управления параметрами */
    const on = id => document.getElementById(id).checked;
    let reported = false;

    Ticker.shared.add(() => {
        const t = performance.now() / 1000;
        try {
            if (on('t-eyes')) {
                sprite.setParameterValueById('ParamEyeLOpen', 0);
                sprite.setParameterValueById('ParamEyeROpen', 0);
            }
            if (on('t-tail')) sprite.setParameterValueById('ParamAngleX', 20 * Math.sin(t * 3));
            if (on('t-ears')) sprite.setParameterValueById('ParamBrowLForm', Math.sin(t * 4));
            if (on('t-paw'))  sprite.setParameterValueById('ParamAngleY', 20 * Math.sin(t * 5));
        } catch (e) {
            if (!reported) { reported = true; log('Ошибка при управлении параметром: ' + e.message, 'err'); }
        }
    });
}

main().catch(e => log('Ошибка: ' + (e && e.message ? e.message : e), 'err'));
</script>
</body>
</html>
