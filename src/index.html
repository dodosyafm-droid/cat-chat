<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кот</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px system-ui, "Segoe UI", sans-serif; color: #eee; }
    body.debug.bg-check {
        background-color: #bbb;
        background-image:
            linear-gradient(45deg, #888 25%, transparent 25%, transparent 75%, #888 75%),
            linear-gradient(45deg, #888 25%, transparent 25%, transparent 75%, #888 75%);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
    }
    body.debug.bg-dark { background: #15151b; }
    #stage { position: absolute; inset: 0; }
    body.debug #stage { inset: 0 340px 0 0; }
    #stage canvas { display: block; }
    #panel {
        display: none;
        position: absolute; top: 0; right: 0; bottom: 0; width: 340px; box-sizing: border-box;
        padding: 10px; overflow: auto; background: rgba(18, 18, 26, 0.95); z-index: 5;
    }
    body.debug #panel { display: block; }
    #panel h3 { margin: 12px 0 6px; font-size: 13px; color: #f3c46b; }
    #panel button { margin: 2px 2px 2px 0; padding: 4px 8px; cursor: pointer; background: #3a3a4d; color: #eee; border: 1px solid #555; border-radius: 4px; }
    #panel label { display: block; margin: 4px 0; }
    #log { white-space: pre-wrap; line-height: 1.4; word-break: break-word; }
    #log .err { color: #ff8a8a; }
    #log .ok { color: #8aff9d; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="panel">
    <h3>Состояние</h3>
    <div id="log"></div>

    <h3>Фон</h3>
    <button data-bg="bg-check">Шахматка</button>
    <button data-bg="bg-dark">Тёмный</button>

    <h3>Поведение кота</h3>
    <label><input type="checkbox" id="auto" checked> автоповедение (хвост, глаза, ухо, лапа)</label>
    <div>Настроение чата: тихо ← → оживлённо</div>
    <input type="range" id="mood" min="0" max="1" step="0.01" value="0.4" style="width:100%">
    <label><input type="checkbox" id="mood-manual"> задать настроение вручную (иначе по сообщениям)</label>
    <div id="mood-now"></div>
    <button id="b-blink">Моргнуть</button>
    <button id="b-ear">Дёрнуть ухом</button>
    <button id="b-paw">Помахать лапой</button>
    <button id="b-msg">Новое сообщение</button>
    <button id="ranges">Показать диапазоны параметров</button>

    <h3>Ручная проверка одного параметра</h3>
    <select id="p-id" style="width:100%"></select>
    <div>значение: <input type="number" id="p-val" value="1" step="0.1" style="width:80px"></div>
    <label><input type="checkbox" id="p-hold"> держать это значение</label>
</div>

<!-- Cubism Core 5.x: файл лежит рядом со страницей -->
<script src="./live2dcubismcore.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
